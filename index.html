<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARÍA MARTÍNEZ | Trabajo Social Sanitario</title>
    
    <!-- Tipografías estilo editorial moda (Stradivarius aesthetic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        /* VARIABLES DE COLOR Y TIPOGRAFÍA */
        :root {
            --bg-rosa: #D9829B;       /* Rosa editorial elegante */
            --bg-rosa-oscuro: #C96E88; /* Variación sutil para bloques */
            --texto-blanco: #FFFFFF;
            --borde-fino: rgba(255, 255, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-rosa);
            color: var(--texto-blanco);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: var(--texto-blanco);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        a:hover {
            opacity: 0.65;
        }

        /* BARRA SUPERIOR ESTILO STRADIVARIUS */
        .top-banner {
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 8px 15px;
            border-bottom: 1px solid var(--borde-fino);
            background-color: var(--bg-rosa);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 5%;
            background-color: rgba(217, 130, 155, 0.95);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--borde-fino);
        }

        .brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-weight: 400;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        nav a {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 400;
        }

        /* HERO EDITORIAL A PANTALLA COMPLETA */
        .hero-editorial {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 1px solid var(--borde-fino);
        }

        .tag-editorial {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            margin-bottom: 24px;
            display: block;
        }

        .hero-editorial h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.8rem, 6.5vw, 5.5rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0.02em;
            max-width: 950px;
            margin-bottom: 28px;
        }

        .hero-editorial h1 em {
            font-style: italic;
        }

        .hero-editorial p {
            max-width: 560px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin-bottom: 42px;
            opacity: 0.95;
        }

        .btn-stradi {
            display: inline-block;
            padding: 15px 45px;
            border: 1px solid var(--texto-blanco);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            background: transparent;
            transition: all 0.35s ease;
        }

        .btn-stradi:hover {
            background-color: var(--texto-blanco);
            color: var(--bg-rosa);
            opacity: 1;
        }

        /* SECCIÓN DOBLE COLUMNA (PERFIL / MANIFIESTO) */
        .editorial-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--borde-fino);
        }

        .split-box {
            padding: 90px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .split-box:first-child {
            border-right: 1px solid var(--borde-fino);
            background-color: var(--bg-rosa-oscuro);
        }

        .split-box h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 20px;
            line-height: 1.15;
        }

        .split-box p {
            font-size: 0.88rem;
            margin-bottom: 18px;
            letter-spacing: 0.04em;
        }

        /* CATÁLOGO DE INTERVENCIÓN (GRID MINIMALISTA) */
        .services-section {
            padding: 100px 5%;
            border-bottom: 1px solid var(--borde-fino);
        }

        .section-header {
            text-align: center;
            margin-bottom: 65px;
        }

        .section-header span {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            display: block;
            margin-bottom: 10px;
        }
