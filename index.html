<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El papel del trabajador social | María Martínez Arana</title>
    <!-- Tipografías editoriales minimalistas estilo Stradivarius -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* RESET Y ESTILOS GENERALES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #E598B3; /* Fondo rosa empolvado elegante */
            color: #FFFFFF; /* Letras blancas */
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            letter-spacing: 0.04em;
            overflow-x: hidden;
        }

        a {
            color: #FFFFFF;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        a:hover {
            opacity: 0.7;
        }

        /* CABECERA ESTILO STRADIVARIUS */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 22px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(229, 152, 179, 0.94);
            backdrop-filter: blur(6px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 400;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 400;
        }

        /* PORTADA PRINCIPAL (HERO EDITORIAL) */
        .hero {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 130px 25px 80px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .hero-tag {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            margin-bottom: 22px;
            opacity: 0.95;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 5.2vw, 4.4rem);
            font-weight: 400;
            line-height: 1.12;
            margin-bottom: 28px;
            max-width: 950px;
        }

        .hero-lema {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.35rem;
            max-width: 720px;
            margin-bottom: 40px;
            opacity: 0.95;
        }

        .btn-editorial {
            display: inline-block;
            padding: 14px 42px;
            border: 1px solid #FFFFFF;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            background: transparent;
            transition: all 0.3s ease;
        }

        .btn-editorial:hover {
            background-color: #FFFFFF;
            color: #E598B3;
            opacity: 1;
        }

        /* SECCIONES GENERALES */
        .section-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 95px 30px;
        }

        .section-title {
            text-align: center;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            margin-bottom: 50px;
            font-weight: 400;
        }

        /* BLOQUE DE QUÉ TRATA + IMAGEN EDITORIAL */
        .about-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 50px;
            align-items: center;
        }

        .about-text p {
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: justify;
        }

        .about-image {
            border: 1px solid #FFFFFF;
            padding: 10px;
        }

        .about-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* PREGUNTA DE INVESTIGACIÓN DESTACADA */
        .research-question {
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 80px 30px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .research-question blockquote {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 3.2vw, 2.5rem);
            font-style: italic;
            max-width: 880px;
            margin: 0 auto;
            line-height: 1.35;
        }

        /* OBJETIVOS DEL PROYECTO (3 COLUMNAS) */
        .grid-objectives {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 35px;
        }

        .objective-card {
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 45px 32px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .objective-card:hover {
            transform: translateY(-5px);
            border-color: #FFFFFF;
        }

        .objective-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-style: italic;
            display: block;
            margin-bottom: 18px;
        }

        .objective-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .objective-card p {
            font-size: 0.88rem;
            opacity: 0.92;
        }

        /* SECCIÓN DE VÍDEO FINAL */
        .video-section {
            padding: 85px 30px 115px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .video-wrapper {
            max-width: 850px;
            margin: 0 auto;
            border: 1px solid #FFFFFF;
            padding: 12px;
        }

        .video-responsive {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* PIE DE PÁGINA */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding: 55px 30px;
            text-align: center;
            font-size: 0.74rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

            margin-bottom:
